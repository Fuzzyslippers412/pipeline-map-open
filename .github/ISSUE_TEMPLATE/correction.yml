name: Report a correction
description: Identify a source, definition or editorial classification that should change.
title: "[Correction] "
body:
  - type: input
    id: record
    attributes:
      label: Profession, source table or URL
      description: Link to the record or paste its source identifier.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Identify the observation or institutional classification and explain the proposed correction.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Supporting publisher or institutional source URL
    validations:
      required: true
